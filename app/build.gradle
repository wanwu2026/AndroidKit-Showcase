plugins { id 'com.android.application' }

android {
    namespace 'com.example.showcase'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.showcase"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

def CARDKEY = 'com.github.wanwu2026:CardKeySDK:TAG'
def UPDATEKIT = 'com.github.wanwu2026:UpdateKit:TAG'
def CRASHKIT = 'com.github.wanwu2026:CrashKit:TAG'

dependencies {
    // 三套 SDK：把 TAG 换成实际版本（如 v1.0.0）。首次需在 jitpack.io 触发构建。
    implementation CARDKEY
    implementation UPDATEKIT
    implementation CRASHKIT
}
